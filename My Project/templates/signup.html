<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Disaster Relief - Create Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <nav>
            <div class="nav_logo">
                <h1><a href="#">Disaster Relief System</a></h1>
            </div>
            <ul class="nav_link">
                <li><a href="/login">Login</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="login_box">
            <h1>Create Account</h1>
            <form class="login_form" method="POST" action="/signup">
                <input type="text" name="username" placeholder="Choose Username" required>
                <input type="password" name="password" placeholder="Choose Password" required>
                <label for="role" style="font-family: 'Montserrat', sans-serif; font-size: 0.85rem; color: #555; margin-bottom: 8px;">Account Type</label>
                <select name="role" id="role" style="padding: 12px; margin-bottom: 28px; border: none; border-bottom: 1px solid #dcd6cd; font-family: 'Montserrat', sans-serif; background: transparent; outline: none;" required>
                    <option value="Customer">Customer (General Public)</option>
                    <option value="Admin">Administrator</option>
                </select>
                <input type="submit" value="Register Account">
            </form>
        </div>
    </main>
</body>
</html>
