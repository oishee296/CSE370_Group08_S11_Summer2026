<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Inventory Item</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header>
        <nav>
            <div class="nav_logo">
                <h1><a href="/home">Disaster Relief System</a></h1>
            </div>
            <ul class="nav_link">
                <li><a href="/home">Dashboard</a></li>
                <li><a href="/logout">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main style="align-items: flex-start; padding-top: 40px;">
        <div class="table_container">
            <h1>Add Inventory Item</h1>
            <p style="text-align: center; margin-bottom: 30px; color: #777;">
                Add new relief supplies to the inventory.
            </p>

            <form method="POST">

                <label for="item_name">Item Name</label>
                <input type="text" id="item_name" name="item_name" required>

                <br><br>

                <label for="category">Category</label>
                <input type="text" id="category" name="category" required>

                <br><br>

                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" name="quantity" min="0" required>

                <br><br>

                <label for="expiration_date">Expiration Date</label>
                <input type="date" id="expiration_date" name="expiration_date" required>

                <br><br>

                <div style="text-align: center;">
                    <button type="submit">Add Item</button>
                </div>

            </form>

            <br>

            <div style="text-align: center;">
                <a href="{{ url_for('home') }}">
                    Back to Inventory Monitor
                </a>
            </div>
        </div>
    </main>
</body>
</html>
